# ═════════════════════════════════════════════════════════════
# WORKSPACE (restringir comandos al directorio del proyecto)
# ═════════════════════════════════════════════════════════════
workspace:
  description: "Restricciones de workspace"

  # Directorio raíz del proyecto
  allowed_root: "."
  
  # Si true, solo permite comandos dentro del workspace
  restrict_to_workspace: false

  # Rutas permitidas (si restrict_to_workspace es true)
  allowed_paths:
    - "."
    - "./src"
    - "./tests"
    - "./docs"
    - "./examples"
    - "./config"
    - "./deployment"

# ═════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE LOGGING
# ═════════════════════════════════════════════════════════════
logging:
  description: "Configuración de logging de seguridad"

  # Nivel de detalle: debug, info, warning, error
  level: "info"

  # Guardar log de comandos ejecutados
  log_commands: true

  # Ruta del archivo de log
  log_file: ".opencode/logs/security.log"

  # Incluir timestamp en logs
  include_timestamp: true
