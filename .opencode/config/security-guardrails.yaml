# ═════════════════════════════════════════════════════════════
# SECURITY GUARDRAILS - Configuración Centralizada
# ═════════════════════════════════════════════════════════════
# Este archivo define los permisos y restricciones de seguridad
# para todos los agentes del sistema.
#
# Niveles de acción:
#   deny:   Bloquea automáticamente (nunca ejecuta)
#   ask:    Requiere aprobación del usuario
#   allow:  Ejecuta sin restricciones
# ═════════════════════════════════════════════════════════════

version: "1.0"
last_updated: "2026-03-28"

# ═════════════════════════════════════════════════════════════
# BLOQUEOS ABSOLUTOS (deny - nunca ejecutar)
# ═════════════════════════════════════════════════════════════
absolute_deny:
  description: "Comandos que nunca se deben ejecutar bajo ninguna circunstancia"

  filesystem:
    - "rm -rf /"
    - "rm -rf ."
    - "rm -rf /*"
    - "rm -rf *"
    - "mkfs"
    - "mkfs.*"
    - "dd if=.*of=/dev/"
    - "dd if=/dev/zero of=.*"
    - "shred -"
    - "> /dev/sd*"
    - "parted"

  system:
    - "reboot"
    - "shutdown"
    - "init 0"
    - "init 6"
    - "halt"
    - "poweroff"

  containers_destructive:
    - "docker system prune"
    - "docker system prune -a"
    - "podman system prune"
    - "podman system prune -a"
    - "docker system df"
    - "podman system df"

# ═════════════════════════════════════════════════════════════
# PROTECCIÓN DE ARCHIVOS (deny - nunca modificar)
# ═════════════════════════════════════════════════════════════
protected_files:
  description: "Archivos que nunca deben ser modificados"

  credentials:
    - "**/*.pem"
    - "**/*.crt"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/credentials.json"
    - "**/service-account.json"
    - "**/.aws/**"
    - "**/.kube/**"
    - "**/.ssh/**"
    - "**/.env"
    - "**/.env.local"
    - "**/.env.production"

  system:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyo"
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/venv/**"

# ═════════════════════════════════════════════════════════════
# PERMISOS POR AGENTE
# ═════════════════════════════════════════════════════════════
agent_permissions:
  description: "Configuración granular de permisos por agente"

  # ─────────────────────────────────────────────────────────────
  # AGENTE PRINCIPAL
  # ─────────────────────────────────────────────────────────────
  OpenCoder:
    description: "Agente principal de desarrollo"
    default_action: "ask"

    allowed:
      - "git add *"
      - "git commit *"
      - "git push"
      - "git pull"
      - "git status"
      - "git diff"
      - "git log *"
      - "python *"
      - "pytest *"
      - "pip install"
      - "pip uninstall"
      - "npm install"
      - "npm run *"
      - "mkdir"
      - "touch"
      - "echo"
      - "cat"
      - "ls"
      - "pwd"
      - "cd"
      - "cp"
      - "mv"
      - "grep"
      - "find"
      - "head"
      - "tail"
      - "wc"

    denied_always:
      - "rm -rf *"
      - "sudo *"
      - "chmod -R 777"

    approval_required:
      - "git push --force"
      - "git push --force-with-lease"
      - "git reset --hard"
      - "git clean -fdx"
      - "pip install --force-reinstall"
      - "pip install --force"
      - "curl.*\\| sh"
      - "wget.*\\| sh"

  OpenAgent:
    description: "Agente general de tareas"
    default_action: "ask"

    allowed:
